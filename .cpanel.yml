---
deployment:
  tasks:
    - export DEPLOYPATH=/home/priseghy/public_html
    - /bin/cp -rf index.html site.css site.js property.html $DEPLOYPATH/
    - /bin/cp -rf admin.html admin-development.js $DEPLOYPATH/
    - /bin/cp -rf api.php $DEPLOYPATH/
    - test -f "$DEPLOYPATH/data.json" || /bin/cp data.json "$DEPLOYPATH/"
    - /bin/cp -rf favicon.svg $DEPLOYPATH/
    - /bin/cp -rf robots.txt llms.txt sitemap.xml $DEPLOYPATH/
    - /bin/cp -rf nigerians-in-diaspora-property-investment verify-property trust privacy terms $DEPLOYPATH/
    - /bin/cp -rf images $DEPLOYPATH/
    - /bin/cp -rf api $DEPLOYPATH/
    - /bin/mkdir -p "$DEPLOYPATH/uploads"
    - /bin/cp -rn uploads/. "$DEPLOYPATH/uploads/"
